services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakeouflage-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      TZ: Asia/Kolkata
    depends_on:
      - db

  db:
    image: mariadb:10.6.25
    container_name: cakeouflage-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cakeouflage-3530373538ac
      MARIADB_USER: cakeouflage-3530373538ac
      MARIADB_PASSWORD: 3btoum4iwi
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  db_data:
