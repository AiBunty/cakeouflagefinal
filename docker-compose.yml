services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakeouflage-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_COOKIE_SECURE: "0"
      TZ: Asia/Kolkata
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: cakeouflage-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cakeouflage_local
      MYSQL_USER: cakeouflage
      MYSQL_PASSWORD: cakeouflage
      TZ: Asia/Kolkata
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  db_data:
