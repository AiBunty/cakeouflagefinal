version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cakeouflage_app
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      APP_ENV: development
    networks:
      - cakeouflage-e-commerce-1_default
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cakeouflage_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cakeouflage_dev
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
    volumes:
      - cakeouflage_mysql_data:/var/lib/mysql
      - ./sdb-77_hosting_stackcp_net.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cakeouflage-e-commerce-1_default

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cakeouflage_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: cakeouflage_mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - cakeouflage-e-commerce-1_default
    depends_on:
      - db

volumes:
  cakeouflage_mysql_data:
    external: true
    name: cakeouflage-e-commerce-1_mysql_data

networks:
  cakeouflage-e-commerce-1_default:
    external: true
